function providerCard(name,description,symbol,id){if(state.providerOverrides[id]){name=escapeHTML(state.providerOverrides[id].name);description=escapeHTML(state.providerOverrides[id].endpoint)}return `<div class="provider-card"><span class="provider-icon">${symbol}</span><div class="provider-info"><b>${name}</b><p>${description}</p></div><span class="tag">${id==='anthropic'?'默认':'已添加'}</span><button class="icon-btn" data-action="edit-provider" data-provider="${id}" aria-label="编辑 ${name}">${icon('settings')}</button></div>`}

function openProvider(id){const providers={anthropic:{name:'Anthropic',endpoint:'https://api.anthropic.com'},openai:{name:'OpenAI',endpoint:'https://api.openai.com/v1'}};const provider=id===undefined?{name:'',endpoint:''}:state.providerOverrides[id]||providers[id]||state.providers[Number(id)];state.editingProvider=id;const form=$('#provider-form');form.elements.name.value=provider.name;form.elements.endpoint.value=provider.endpoint;form.elements.key.value='';$('#provider-title').textContent=id===undefined?'添加服务商':'服务商配置';$('#provider-dialog').showModal()}
$('#provider-form').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget;const provider={name:form.elements.name.value,endpoint:form.elements.endpoint.value};if(state.editingProvider===undefined)state.providers.push(provider);else if(['anthropic','openai'].includes(state.editingProvider))state.providerOverrides[state.editingProvider]=provider;else state.providers[Number(state.editingProvider)]=provider;form.elements.key.value='';$('#provider-dialog').close();renderSettings('models');toast('演示配置已保存，未发起网络连接')});

const commands=[{title:'新建任务',icon:'plus',shortcut:'Ctrl N',action:'new-chat'},{title:'外观与主题',icon:'sun',shortcut:'设置',action:'open-settings',page:'appearance'},{title:'模型与服务商',icon:'spark',action:'open-settings',page:'models'},{title:'查看右侧预览',icon:'window',action:'show-preview'},{title:'查看本次变更',icon:'diff',action:'show-changes'},{title:'打开终端',icon:'terminal',action:'show-terminal'},...Object.entries(threads).map(([key,[title]])=>({title,icon:'history',action:'thread',thread:key}))];
function renderCommands(query=''){state.filteredCommands=commands.filter(item=>item.title.toLowerCase().includes(query.toLowerCase()));state.commandIndex=0;$('#command-results').innerHTML=state.filteredCommands.map((item,index)=>`<button class="command-result ${index===0?'focused':''}" data-action="command" data-index="${index}">${icon(item.icon)}<span>${item.title}</span>${item.shortcut?`<kbd>${item.shortcut}</kbd>`:item.thread?'<small>Lumen</small>':''}</button>`).join('')||'<p class="muted" style="padding:20px;font-size:12px">没有找到匹配的任务或操作。</p>'}
function openSearch(){closePopover();if($('#settings-dialog').open)$('#settings-dialog').close();$('#command-input').value='';renderCommands();$('#command-dialog').showModal();$('#command-input').focus()}
$('#command-input').addEventListener('input',event=>renderCommands(event.target.value));
$('#command-input').addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const length=state.filteredCommands.length;if(!length)return;state.commandIndex=(state.commandIndex+(event.key==='ArrowDown'?1:-1)+length)%length;$$('.command-result').forEach((el,index)=>el.classList.toggle('focused',index===state.commandIndex));$$('.command-result')[state.commandIndex].scrollIntoView({block:'nearest'})}if(event.key==='Enter'){event.preventDefault();if(state.filteredCommands.length)executeCommand(state.commandIndex)}});
function executeCommand(index){const item=state.filteredCommands[index];$('#command-dialog').close();performAction(item.action,item)}
let activePopover='';
function closePopover(){$('#popover').hidden=true;activePopover='';$('#model-trigger').setAttribute('aria-expanded','false')}
function openPopover(type,anchor){if(activePopover===type){closePopover();return}let html='';
 if(type==='model-menu')html=`<div class="popover-title">选择模型</div>${[['Claude Sonnet 4.5','平衡速度与深度，适合日常创作','✳'],['Claude Opus 4.5','复杂推理与细致的设计工作','✳'],['GPT-5','编程、规划与多步骤任务','◎'],['GPT-5 mini','轻量任务，更快一点','◎']].map(([name,desc,symbol])=>`<button class="popover-option" data-action="choose-model" data-model="${name}"><span class="model-symbol">${symbol}</span><span class="model-info">${name}<small>${desc}</small></span>${prefs.model===name?icon('check'):''}</button>`).join('')}<div class="popover-divider"></div><div class="popover-title">思考强度</div><div class="effort-options">${['快速','均衡','深度'].map(value=>`<button class="${prefs.effort===value?'active':''}" data-action="choose-effort" data-effort="${value}">${value}</button>`).join('')}</div>`;
 if(type==='permission-menu')html=`<div class="popover-title">这次任务的工作方式</div>${[['请求批准','每次操作前确认'],['自动编辑','编辑自由，运行前确认'],['完全访问','适合受信任的工作区']].map(([value,desc])=>`<button class="popover-option" data-action="choose-permission" data-value="${value}">${icon('shield','small')}<span class="model-info">${value}<small>${desc}</small></span>${prefs.permission===value?icon('check'):''}</button>`).join('')}`;
 if(type==='attach-menu')html=`<div class="popover-title">把上下文带进来</div><button class="popover-option" data-action="upload">${icon('paperclip','small')}添加文件或图片<span class="spacer"></span>${icon('plus')}</button><button class="popover-option" data-action="add-context">${icon('file','small')}引用当前文件</button><button class="popover-option" data-action="show-files">${icon('folder','small')}浏览工作区文件</button>`;
 if(type==='thread-menu')html=`<div class="popover-title">当前任务</div><button class="popover-option" data-action="export-thread">${icon('download','small')}导出对话</button><button class="popover-option" data-action="new-chat">${icon('plus','small')}开始新任务</button><div class="popover-divider"></div><button class="popover-option" data-action="open-settings" data-page="appearance">${icon('sun','small')}调整工作台外观</button>`;
 if(type==='workspace-menu')html=`<div class="popover-title">切换工作空间</div><button class="popover-option" data-action="thread" data-thread="design"><span class="project-mark">L</span>Lumen${icon('check')}</button><button class="popover-option" data-action="thread" data-thread="component">${icon('folder','small')}MiniCode</button><div class="popover-divider"></div><button class="popover-option" data-action="open-settings" data-page="workspace">${icon('settings','small')}工作区设置</button>`;
 const popup=$('#popover');popup.innerHTML=html;popup.hidden=false;activePopover=type;const rect=anchor.getBoundingClientRect();const x=Math.min(Math.max(10,rect.left),innerWidth-popup.offsetWidth-10);const y=rect.top>innerHeight/2?rect.top-popup.offsetHeight-9:rect.bottom+8;popup.style.left=x+'px';popup.style.top=Math.min(Math.max(8,y),innerHeight-popup.offsetHeight-8)+'px';$('#model-trigger').setAttribute('aria-expanded',type==='model-menu');
}
function syncPanelAccessibility(){const leftHidden=$('#app').classList.contains('left-hidden'),rightHidden=$('#app').classList.contains('right-hidden');$('.sidebar').inert=leftHidden;$('.right-panel').inert=rightHidden;$('#right-toggle').setAttribute('aria-expanded',!rightHidden);$('[data-action="toggle-sidebar"]').setAttribute('aria-expanded',!leftHidden)}
function showRight(tab){$('#app').classList.remove('right-hidden');$('#right-toggle').classList.add('active');renderRight(tab);syncPanelAccessibility()}
function updateSendButton(){$('#send-button').disabled=!state.sending&&!$('#prompt').value.trim();$('#send-button').innerHTML=icon(state.sending?'stop':'arrow-up');$('#send-button').setAttribute('aria-label',state.sending?'停止生成':'发送消息')}
let responseTimer;
function sendMessage(){
 if(state.sending){finishResponse(true);return}
 const input=$('#prompt'),prompt=input.value.trim();if(!prompt)return;
 if(state.thread==='new'&&!state.messages.new){$('#transcript').innerHTML='';$('#thread-title').textContent=prompt.length>18?prompt.slice(0,18)+'…':prompt}
 const user=document.createElement('div');user.className='user-message live-response';user.textContent=prompt;$('#transcript').append(user);
 const article=document.createElement('article');article.className='live-response';article.innerHTML=`<div class="assistant-mark"><span class="asterisk">✳</span>MINICODE</div><div class="live-line"><span class="thinking-dot"></span>正在整理这个想法…</div><div class="live-answer"></div>`;$('#transcript').append(article);
 state.liveArticle=article;state.liveUser=user.outerHTML;state.sending=true;input.value='';input.style.height='';updateSendButton();$('#chat-scroll').scrollTop=$('#chat-scroll').scrollHeight;
 const reply=/深色|暗色/.test(prompt)?'深色也可以保持温暖。\n\n我建议用带一点橄榄色的炭灰代替纯黑，正文保留柔和的米白，让陶土色在暗处依旧自然。你可以打开「设置 → 外观」，直接切换比较。':/柔和|配色|颜色/.test(prompt)?'可以，把色彩再往自然里收一点。\n\n让纸白承担大部分面积，苔绿只出现在主要行动上，陶土色则留给需要被注意的小细节。右侧预览已经采用了这个方向，你也可以在外观设置里试试鼠尾草色。':/组件|代码|结构/.test(prompt)?'我会从清晰的边界开始整理：导航负责找到工作，对话负责理清思路，右侧面板负责查看结果。\n\n共享的颜色、间距和动效集中成一套设计变量。这样未来迁移到 MiniCode 时，可以逐个替换组件，同时保持整个产品的节奏。':/工作|回顾/.test(prompt)?'这一轮可以留下三个清晰的成果：温润的视觉语言、可操作的工作面板，以及随时可调整的个人偏好。\n\n下一步最值得验证的是长时间阅读、频繁切换文件，以及不同屏幕尺寸下的舒适度。':`收到，我们就从「${prompt.slice(0,65)}」继续。\n\n先把最重要的内容放在视线中心，让工具保持清楚而安静。右侧可以直接试用预览、查看文件变更；外观设置中的主题、颜色与文字大小都会即时生效。`;
 state.responseText=reply;state.responseIndex=0;
 responseTimer=setTimeout(()=>{article.querySelector('.live-line').hidden=true;responseTimer=setInterval(()=>{state.responseIndex+=3;article.querySelector('.live-answer').textContent=reply.slice(0,state.responseIndex);const scroll=$('#chat-scroll');if(scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<140)scroll.scrollTop=scroll.scrollHeight;if(state.responseIndex>=reply.length)finishResponse(false)},20)},650);
}
function finishResponse(stopped){clearTimeout(responseTimer);clearInterval(responseTimer);const article=state.liveArticle;article.querySelector('.live-line').hidden=true;if(stopped){const status=document.createElement('div');status.className='muted';status.style.cssText='font-size:10px;margin-bottom:22px';status.textContent='已停止，已生成的内容保留在这里。';article.append(status)}else{const foot=document.createElement('div');foot.className='answer-foot';foot.innerHTML=`<button class="icon-btn" data-action="copy-answer" aria-label="复制回答">${icon('copy')}</button><span>交互演示 · ${escapeHTML(prefs.model)}</span>`;article.append(foot)}state.messages[state.thread]=(state.messages[state.thread]||'')+state.liveUser+article.outerHTML;state.sending=false;updateSendButton();if(prefs.notifications&&!stopped)toast('演示回复已完成')}
$('#prompt').addEventListener('input',event=>{updateSendButton();event.target.style.height='auto';event.target.style.height=Math.min(event.target.scrollHeight,160)+'px'});
$('#prompt').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();if(!state.sending)sendMessage()}});
$('#file-input').addEventListener('change',event=>{for(const file of event.target.files){const chip=document.createElement('span');chip.className='context-chip';chip.innerHTML=icon('paperclip')+escapeHTML(file.name)+`<button aria-label="移除 ${escapeHTML(file.name)}" data-action="remove-context">${icon('close')}</button>`;$('#composer-context').append(chip)}event.target.value='';toast('已添加附件名称，仅用于交互预览')});
async function performAction(action,data={},element){
 if(['model-menu','permission-menu','attach-menu','thread-menu','workspace-menu'].includes(action)){openPopover(action,element);return}
 if(!['choose-model','choose-effort'].includes(action))closePopover();
 switch(action){
 case 'new-chat':switchThread('new');$('#prompt').focus();break;
 case 'thread':switchThread(data.thread);break;
 case 'search':openSearch();break;
 case 'command':executeCommand(Number(data.index));break;
 case 'toggle-sidebar':$('#app').classList.toggle('left-hidden');break;
 case 'toggle-right':$('#app').classList.toggle('right-hidden');$('#right-toggle').classList.toggle('active',!$('#app').classList.contains('right-hidden'));break;
 case 'toggle-project':{const open=$('#project-threads').hidden;$('#project-threads').hidden=!open;element.setAttribute('aria-expanded',open);element.querySelector('svg:last-child').style.transform=open?'':'rotate(-90deg)';break}
 case 'open-settings':openSettings(data.page||'appearance');break;
 case 'close-settings':$('#settings-dialog').close();break;
 case 'settings-page':renderSettings(data.page);break;
 case 'preference':savePreference(data.pref,data.value);renderSettings(state.page,true);break;
 case 'toggle-preference':savePreference(data.pref,!prefs[data.pref]);element.setAttribute('aria-checked',prefs[data.pref]);break;
 case 'reset-appearance':['theme','accent','density','fontSize','motion'].forEach(key=>prefs[key]=defaults[key]);localStorage.setItem(storageKey,JSON.stringify(prefs));applyPreferences();toast('已恢复默认外观');break;
 case 'add-provider':openProvider();break;
 case 'edit-provider':openProvider(data.provider);break;
 case 'close-provider':$('#provider-dialog').close();break;
 case 'right-tab':renderRight(data.tab);break;
 case 'show-preview':showRight('preview');break;
 case 'show-changes':showRight('changes');break;
 case 'show-files':showRight('files');break;
 case 'show-terminal':showRight('terminal');break;
 case 'device':state.device=data.device;renderRight('preview');break;
 case 'article-open':state.article=true;renderRight('preview');break;
 case 'article-back':state.article=false;renderRight('preview');break;
 case 'bookmark':state.bookmarked=!state.bookmarked;renderRight('preview');toast(state.bookmarked?'已加入演示阅读列表':'已移出阅读列表');break;
 case 'refresh-preview':renderRight('preview');toast('预览已刷新');break;
 case 'expand-preview':$('#app').classList.toggle('left-hidden');$('#app').style.setProperty('--right-width',$('#app').classList.contains('left-hidden')?'540px':'440px');break;
 case 'review':state.reviewed=true;$('#changes-count').textContent='✓';renderRight('changes');toast('本次变更已标记为审阅完成');break;
 case 'reset-review':state.reviewed=false;$('#changes-count').textContent='3';renderRight('changes');break;
 case 'file':state.selectedFile=data.file;$$('.file-row[data-file]').forEach(el=>el.classList.toggle('selected',el.dataset.file===data.file));$('#file-preview').innerHTML=filePreview();break;
 case 'folder-toggle':{const group=$('#source-files');group.hidden=!group.hidden;element.setAttribute('aria-expanded',!group.hidden);element.querySelector('svg').style.transform=group.hidden?'rotate(-90deg)':'';break}
 case 'clear-terminal':state.terminalLines=[];renderRight('terminal');break;
 case 'send':sendMessage();break;
 case 'suggest':$('#prompt').value=data.text;updateSendButton();$('#prompt').focus();break;
 case 'choose-model':savePreference('model',data.model);activePopover='';openPopover('model-menu',$('#model-trigger'));break;
 case 'choose-effort':savePreference('effort',data.effort);closePopover();break;
 case 'choose-permission':savePreference('permission',data.value);toast('工作方式已切换为'+data.value);break;
 case 'upload':$('#file-input').click();break;
 case 'add-context':{const chip=document.createElement('span');chip.className='context-chip';chip.innerHTML=icon('file')+escapeHTML(state.selectedFile)+`<button data-action="remove-context" aria-label="移除文件引用">${icon('close')}</button>`;$('#composer-context').append(chip);$('#prompt').focus();break}
 case 'remove-context':element.closest('.context-chip').remove();break;
 case 'copy-answer':{const article=element.closest('article');await navigator.clipboard.writeText(article.innerText);toast('回答已复制');break}
 case 'like':element.classList.toggle('active');element.setAttribute('aria-pressed',element.classList.contains('active'));toast(element.classList.contains('active')?'谢谢，这个方向已记下':'已取消标记');break;
 case 'regenerate':$('#prompt').value='给这个设计再提供一个更安静的方向';updateSendButton();$('#prompt').focus();break;
 case 'export-thread':{const blob=new Blob(['# '+$('#thread-title').textContent+'\n\n'+$('#transcript').innerText],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='minicode-studio-conversation.md';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('对话已导出为 Markdown');break}
 }
 syncPanelAccessibility();
}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target)performAction(target.dataset.action,target.dataset,target);else if(!event.target.closest('#popover'))closePopover()});
document.addEventListener('keydown',event=>{const mod=event.ctrlKey||event.metaKey;if(event.key==='Escape'){closePopover();return}if(mod&&event.key.toLowerCase()==='k'){event.preventDefault();if($('#provider-dialog').open)return;openSearch()}if(mod&&event.key===','){event.preventDefault();if(!$('#settings-dialog').open)openSettings('appearance')}if(mod&&event.key.toLowerCase()==='n'){event.preventDefault();if($('dialog[open]'))return;switchThread('new');$('#prompt').focus()}if(mod&&event.key==='\\'){event.preventDefault();performAction('toggle-right')}});
$$('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close()}}));
$('#settings-dialog').addEventListener('close',()=>{$('#settings-search').value=''});
let resizing=false;
$('#resize-handle').addEventListener('pointerdown',event=>{if(innerWidth<=1040)return;resizing=true;$('#app').classList.add('resizing');event.currentTarget.setPointerCapture(event.pointerId);event.preventDefault()});
$('#resize-handle').addEventListener('pointermove',event=>{if(!resizing)return;const width=Math.max(330,Math.min(innerWidth-event.clientX,innerWidth-620));$('#app').style.setProperty('--right-width',width+'px');$('#resize-handle').setAttribute('aria-valuenow',Math.round(width))});
$('#resize-handle').addEventListener('pointerup',()=>{resizing=false;$('#app').classList.remove('resizing')});
$('#resize-handle').addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const width=$('.right-panel').getBoundingClientRect().width+(event.key==='ArrowLeft'?20:-20);$('#app').style.setProperty('--right-width',Math.min(Math.max(width,330),innerWidth-620)+'px')}});
window.addEventListener('resize',()=>{closePopover();if(innerWidth<=1040){$('#app').classList.add('right-hidden');$('#right-toggle').classList.remove('active')}if(innerWidth<=700)$('#app').classList.add('left-hidden');syncPanelAccessibility()});
hydrateIcons();applyPreferences();switchThread(prefs.startup==='显示新任务'?'new':'design');renderRight();
if(innerWidth<=1040){$('#app').classList.add('right-hidden');$('#right-toggle').classList.remove('active')}
if(innerWidth<=700)$('#app').classList.add('left-hidden');
syncPanelAccessibility();
</script>
</body>
</html>
