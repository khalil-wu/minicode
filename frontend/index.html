<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniCode</title>
    <!--
      Theme boot script — must execute synchronously before any stylesheet
      (including the JS-imported tokens.css from src/index.css) is evaluated,
      so that `[data-theme]` selectors resolve correctly on first paint and
      no FOUC occurs. See design.md §Cross-cutting #6.1.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('minicode.theme');
          var theme = pref;
          if (!theme || theme === 'system') {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (theme !== 'light' && theme !== 'dark') {
            theme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* localStorage unavailable: leave default (CSS :root = dark) */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="bg-surface-primary text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src.v2/main.tsx"></script>
</body>
</html>
