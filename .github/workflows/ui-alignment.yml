name: Current desktop UI and reconnect audit
on:
  push:
    paths:
      - 'frontend/src.v2/**'
      - 'backend/agent/progress.py'
      - 'backend/agent/provider_stream*.py'
      - 'backend/ws/agent_runner.py'
      - 'frontend/scripts/audit-ui-alignment.mjs'
      - '.github/workflows/ui-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth bubblewrap ripgrep
          python -m pip install -e .
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Build current desktop renderer
        working-directory: frontend
        env:
          MINICODE_VITE_RELATIVE_BASE: '1'
        run: npm run build
      - name: Capture real UI and provider retry chain
        run: xvfb-run -a --server-args='-screen 0 1920x1200x24' node frontend/scripts/audit-ui-alignment.mjs
      - name: Upload current build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-desktop-ui-evidence
          path: output/playwright/ui-alignment-current/
          if-no-files-found: error
