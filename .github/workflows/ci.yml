name: MiniCode CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native-execpolicy:
    name: Build pinned Source execution policy (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/native-execpolicy -> target
      - name: Fetch locked execution policy dependencies
        working-directory: desktop/native-execpolicy
        run: cargo fetch --locked
      - name: Build and verify the pinned native runtime
        run: >-
          python desktop/scripts/prepare-execpolicy-runtime.py
          --cargo "$(rustup which --toolchain 1.95.0 cargo)"
          --output-directory backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
          if-no-files-found: error

  backend:
    name: Backend protocol and tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: native-execpolicy
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            test_path: backend/tests
          - suite: root
            test_path: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - name: Restore native executable permission
        run: chmod +x backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/language-services/package-lock.json
      - name: Install native execution, search and editor dependencies
        run: sudo apt-get update && sudo apt-get install -y git build-essential ripgrep clangd bubblewrap
      - name: Verify Linux sandbox namespaces
        run: bash scripts/prepare-ci-linux-sandbox.sh
      - name: Install bundled editor language services
        run: npm ci --prefix desktop/language-services --omit=dev --no-audit --no-fund
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Collect backend and root tests
        run: python -m pytest "${{ matrix.test_path }}" --collect-only -q
      - name: Check agent kernel boundaries
        run: python scripts/check-agent-kernel-boundaries.py
      - name: Check protocol sync
        run: python scripts/check-protocol-sync.py
      - name: Check duplicate tools
        run: python scripts/check-no-duplicate-tools.py
      - name: Check module size limits
        run: python scripts/check-large-files.py
      - name: Run backend and root tests
        id: backend_tests
        run: |
          set -o pipefail
          session_owner_trace=()
          if [[ "${{ matrix.suite }}" == "backend" ]]; then
            session_owner_trace=(-p scripts.ci_trace_session_owners --session-owner-trace-output=pytest-backend-session-owners.jsonl)
          fi
          python -m pytest "${{ matrix.test_path }}" "${session_owner_trace[@]}" -vv -o faulthandler_timeout=60 --tb=short --junitxml="pytest-${{ matrix.suite }}.xml" 2>&1 | tee "pytest-${{ matrix.suite }}.log"
      - name: Surface backend test failure
        if: failure() && steps.backend_tests.outcome == 'failure'
        run: |
          if grep -q '^=\+ FAILURES =\+' "pytest-${{ matrix.suite }}.log"; then
            failure_lines=$(sed -n '/^=\+ FAILURES =\+/,/^=\+ short test summary info =\+/p' "pytest-${{ matrix.suite }}.log")
          else
            failure_lines=$(tail -120 "pytest-${{ matrix.suite }}.log")
          fi
          while IFS= read -r line; do
            echo "::error file=pytest-${{ matrix.suite }}.log::${line}"
          done <<< "$failure_lines"
          sed -n '/^=\+ short test summary info =\+/,$p' "pytest-${{ matrix.suite }}.log"
      - name: Upload complete backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.suite }}-test-evidence
          path: |
            pytest-${{ matrix.suite }}.log
            pytest-${{ matrix.suite }}.xml
            pytest-backend-session-owners.jsonl
          if-no-files-found: ignore

  windows-harness:
    name: Windows harness and process contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Check Windows execution, storage, and cancellation
        run: >-
          python -m pytest
          backend/tests/test_architecture_review_repairs.py
          backend/tests/test_projection_log.py
          backend/tests/test_native_compaction.py
          backend/tests/test_code_execution.py
          backend/tests/test_model_execution_ownership.py
          backend/tests/test_model_control_ownership.py
          backend/tests/test_extension_model_ownership.py
          backend/tests/test_extension_execution_actions.py
          backend/tests/test_extension_state_deltas.py
          backend/tests/test_journal_context_deltas.py
          backend/tests/test_extension_history_boundaries.py
          backend/tests/test_step_capability_snapshot.py
          backend/tests/test_model_execution_snapshot.py
          backend/tests/test_auth_request_ownership.py
          backend/tests/test_step_auth_refresh.py
          backend/tests/test_code_audio.py
          backend/tests/test_user_request_boundary.py
          backend/tests/test_canonical_context_checkpoint.py
          backend/tests/test_compaction_user_fidelity.py
          backend/tests/test_tool_history_pagination.py
          backend/tests/test_yielding_commands.py
          backend/tests/test_command_output_fidelity.py
          backend/tests/test_terminal_service_canonical_exec.py
          backend/tests/test_background_command_lifecycle.py
          backend/tests/test_apply_patch.py
          backend/tests/test_projectless_execution_cwd_chain.py
          tests/test_windows_low_integrity_sandbox.py
          --maxfail=1 --tb=short

  frontend:
    name: Frontend tests and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle-budget
      - name: UI debt budget
        run: npm run check:ui-debt

  desktop:
    name: Desktop unit and smoke tests
    runs-on: ubuntu-latest
    needs: native-execpolicy
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - name: Restore native executable permission
        run: chmod +x ../backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/language-services/package-lock.json
      - name: Install native execution and language dependencies
        run: sudo apt-get update && sudo apt-get install -y git build-essential ripgrep clangd bubblewrap
      - name: Verify Linux sandbox namespaces
        run: bash ../scripts/prepare-ci-linux-sandbox.sh
      - name: Install backend for the real FastAPI and native ownership test
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e ".[dev]"
      - name: Install bundled editor language services
        run: npm ci --prefix language-services --omit=dev --no-audit --no-fund
      - name: Install desktop
        run: npm ci
      - name: Configure the Electron sandbox helper
        run: |
          node -e 'require("electron")'
          electron_binary="$(node -p 'require("electron")')"
          electron_sandbox="$(dirname "$electron_binary")/chrome-sandbox"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
      - name: Unit tests
        run: npm run test:unit
      - name: Electron smoke test
        run: xvfb-run -a npm run test:e2e

  electron-frontend:
    name: Electron Playwright integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run Electron-facing frontend tests
        working-directory: frontend
        run: xvfb-run -a npm run test:e2e:electron
