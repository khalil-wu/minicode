name: MiniCode CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  LINUX_NATIVE_BASELINE: linux-x64-glibc231-ubuntu20-c664f8f86ed5-v1

jobs:
  native-execpolicy:
    name: Build pinned Source execution policy (Linux x64)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Prepare the fixed Linux build baseline
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git tar xz-utils build-essential binutils
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
      - uses: actions/checkout@v4
      - name: Install the verified portable Python
        run: bash scripts/prepare-ci-linux-python.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.LINUX_NATIVE_BASELINE }}
          workspaces: desktop/native-execpolicy -> target
      - name: Fetch locked execution policy dependencies
        working-directory: desktop/native-execpolicy
        run: cargo fetch --locked
      - name: Build and verify the pinned native runtime
        run: >-
          python3 desktop/scripts/prepare-execpolicy-runtime.py
          --cargo "$(rustup which --toolchain 1.95.0 cargo)"
          --output-directory backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - name: Verify the actual ELF ABI and Source identity
        run: |
          chmod +x backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy
          python3 scripts/verify-linux-native-runtime.py \
          --runtime-directory backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu \
          --report-directory "$RUNNER_TEMP/execpolicy-abi"
      - uses: actions/upload-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-execpolicy-linux-abi-evidence
          path: ${{ runner.temp }}/execpolicy-abi
          if-no-files-found: ignore

  native-network:
    name: Build pinned Source network runtime (Linux x64)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Prepare the fixed Linux build baseline
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git tar xz-utils build-essential binutils pkg-config libssl-dev cmake clang
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 822e58cc3d666166c7446c5b1ea2e52f5d09594c
          path: .tmp/codex-src
          persist-credentials: false
      - name: Install the verified portable Python
        run: bash scripts/prepare-ci-linux-python.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tmp/native-network-build/source/codex-rs/target
          key: ${{ env.LINUX_NATIVE_BASELINE }}-network-822e58cc-1.95.0-${{ hashFiles('desktop/native-network/**', 'desktop/scripts/prepare-network-runtime.py') }}
          restore-keys: ${{ env.LINUX_NATIVE_BASELINE }}-network-822e58cc-1.95.0-
      - name: Build and verify the pinned Source network runtime
        run: >-
          python3 desktop/scripts/prepare-network-runtime.py
          --cargo "$(rustup which --toolchain 1.95.0 cargo)"
          --source-checkout .tmp/codex-src
          --build-directory .tmp/native-network-build
          --output-directory backend/network/resources/x86_64-unknown-linux-gnu
      - name: Verify the actual ELF ABI and Source identity
        run: |
          chmod +x backend/network/resources/x86_64-unknown-linux-gnu/minicode-network
          python3 scripts/verify-linux-native-runtime.py \
          --runtime-directory backend/network/resources/x86_64-unknown-linux-gnu \
          --report-directory "$RUNNER_TEMP/network-abi"
      - uses: actions/upload-artifact@v4
        with:
          name: native-network-linux-x64
          path: backend/network/resources/x86_64-unknown-linux-gnu
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-network-linux-abi-evidence
          path: ${{ runner.temp }}/network-abi
          if-no-files-found: ignore

  linux-wheel:
    name: Linux wheel cold installation (glibc 2.31)
    runs-on: ubuntu-24.04
    needs: [native-execpolicy, native-network]
    container:
      image: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Prepare the fixed Linux install baseline
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git tar binutils
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
      - uses: actions/checkout@v4
      - name: Install the verified portable Python
        run: bash scripts/prepare-ci-linux-python.sh
      - uses: actions/download-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: native-network-linux-x64
          path: backend/network/resources/x86_64-unknown-linux-gnu
      - name: Build a non-editable Linux wheel from the frozen backend
        run: |
          source="$RUNNER_TEMP/linux-wheel-source"
          mkdir -p "$source" "$RUNNER_TEMP/linux-wheel"
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD backend pyproject.toml setup.py | tar -x -C "$source" \
            --exclude='backend/permissions/resources/execpolicy/*' --exclude='backend/network/resources/*'
          mkdir -p "$source/backend/permissions/resources/execpolicy" "$source/backend/network/resources"
          chmod +x backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy backend/network/resources/x86_64-unknown-linux-gnu/minicode-network
          cp -a backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu "$source/backend/permissions/resources/execpolicy/"
          cp -a backend/network/resources/x86_64-unknown-linux-gnu "$source/backend/network/resources/"
          python3 -m pip wheel --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/linux-wheel" "$source"
      - name: Cold-install and execute the actual wheel
        run: |
          mkdir -p "$RUNNER_TEMP/linux-wheel-evidence"
          python3 -m venv "$RUNNER_TEMP/linux-wheel-venv"
          "$RUNNER_TEMP/linux-wheel-venv/bin/python" -m pip install --no-cache-dir "$RUNNER_TEMP/linux-wheel/"*.whl 2>&1 | tee "$RUNNER_TEMP/linux-wheel-evidence/install.log"
          unset PYTHONPATH PYTHONHOME CARGO_HOME RUSTUP_HOME
          export PATH="$RUNNER_TEMP/linux-wheel-venv/bin:/usr/bin:/bin"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/linux-wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify-linux-wheel.py" \
            --wheel-directory "$RUNNER_TEMP/linux-wheel" --report-directory "$RUNNER_TEMP/linux-wheel-evidence" 2>&1 | tee "$RUNNER_TEMP/linux-wheel-evidence/cold-check.log"
      - uses: actions/upload-artifact@v4
        with:
          name: minicode-linux-backend-wheel
          path: ${{ runner.temp }}/linux-wheel/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-wheel-install-evidence
          path: ${{ runner.temp }}/linux-wheel-evidence
          if-no-files-found: ignore

  backend:
    name: Backend protocol and tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [native-execpolicy, native-network]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            test_path: backend/tests
          - suite: root
            test_path: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - name: Restore native executable permission
        run: chmod +x backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy
      - uses: actions/download-artifact@v4
        with:
          name: native-network-linux-x64
          path: backend/network/resources/x86_64-unknown-linux-gnu
      - name: Restore native network executable permission
        run: chmod +x backend/network/resources/x86_64-unknown-linux-gnu/minicode-network
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/language-services/package-lock.json
      - name: Install native execution, search and editor dependencies
        run: sudo apt-get update && sudo apt-get install -y git build-essential ripgrep clangd bubblewrap
      - name: Verify Linux sandbox namespaces
        run: bash scripts/prepare-ci-linux-sandbox.sh
      - name: Install bundled editor language services
        run: npm ci --prefix desktop/language-services --omit=dev --no-audit --no-fund
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Collect backend and root tests
        run: python -m pytest "${{ matrix.test_path }}" --collect-only -q
      - name: Check agent kernel boundaries
        run: python scripts/check-agent-kernel-boundaries.py
      - name: Check protocol sync
        run: python scripts/check-protocol-sync.py
      - name: Check duplicate tools
        run: python scripts/check-no-duplicate-tools.py
      - name: Check module size limits
        run: python scripts/check-large-files.py
      - name: Run backend and root tests
        id: backend_tests
        run: |
          set -o pipefail
          uname -a
          git --version
          bwrap --version
          python -m pytest "${{ matrix.test_path }}" -vv -o faulthandler_timeout=60 -o junit_logging=system-out --tb=short --junitxml="pytest-${{ matrix.suite }}.xml" 2>&1 | tee "pytest-${{ matrix.suite }}.log"
      - name: Surface backend test failure
        if: failure() && steps.backend_tests.outcome == 'failure'
        run: |
          if grep -q '^=\+ FAILURES =\+' "pytest-${{ matrix.suite }}.log"; then
            failure_lines=$(sed -n '/^=\+ FAILURES =\+/,/^=\+ short test summary info =\+/p' "pytest-${{ matrix.suite }}.log")
          else
            failure_lines=$(tail -120 "pytest-${{ matrix.suite }}.log")
          fi
          while IFS= read -r line; do
            echo "::error file=pytest-${{ matrix.suite }}.log::${line}"
          done <<< "$failure_lines"
          sed -n '/^=\+ short test summary info =\+/,$p' "pytest-${{ matrix.suite }}.log"
      - name: Upload complete backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.suite }}-test-evidence
          path: |
            pytest-${{ matrix.suite }}.log
            pytest-${{ matrix.suite }}.xml
          if-no-files-found: ignore

  windows-harness:
    name: Windows harness and process contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Check Windows execution, storage, and cancellation
        run: >-
          python -m pytest
          backend/tests/test_architecture_review_repairs.py
          backend/tests/test_projection_log.py
          backend/tests/test_native_compaction.py
          backend/tests/test_code_execution.py
          backend/tests/test_model_execution_ownership.py
          backend/tests/test_model_control_ownership.py
          backend/tests/test_extension_model_ownership.py
          backend/tests/test_extension_execution_actions.py
          backend/tests/test_extension_state_deltas.py
          backend/tests/test_journal_context_deltas.py
          backend/tests/test_extension_history_boundaries.py
          backend/tests/test_step_capability_snapshot.py
          backend/tests/test_model_execution_snapshot.py
          backend/tests/test_auth_request_ownership.py
          backend/tests/test_step_auth_refresh.py
          backend/tests/test_code_audio.py
          backend/tests/test_user_request_boundary.py
          backend/tests/test_canonical_context_checkpoint.py
          backend/tests/test_compaction_user_fidelity.py
          backend/tests/test_tool_history_pagination.py
          backend/tests/test_yielding_commands.py
          backend/tests/test_command_output_fidelity.py
          backend/tests/test_terminal_service_canonical_exec.py
          backend/tests/test_background_command_lifecycle.py
          backend/tests/test_apply_patch.py
          backend/tests/test_projectless_execution_cwd_chain.py
          tests/test_windows_low_integrity_sandbox.py
          --maxfail=1 --tb=short

  frontend:
    name: Frontend tests and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle-budget
      - name: UI debt budget
        run: npm run check:ui-debt

  desktop:
    name: Desktop unit and smoke tests
    runs-on: ubuntu-latest
    needs: [native-execpolicy, native-network]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-execpolicy-linux-x64
          path: backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu
      - name: Restore native executable permission
        run: chmod +x ../backend/permissions/resources/execpolicy/x86_64-unknown-linux-gnu/minicode-execpolicy
      - uses: actions/download-artifact@v4
        with:
          name: native-network-linux-x64
          path: backend/network/resources/x86_64-unknown-linux-gnu
      - name: Restore native network executable permission
        run: chmod +x ../backend/network/resources/x86_64-unknown-linux-gnu/minicode-network
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/language-services/package-lock.json
      - name: Install native execution and language dependencies
        run: sudo apt-get update && sudo apt-get install -y git build-essential ripgrep clangd bubblewrap
      - name: Verify Linux sandbox namespaces
        run: bash ../scripts/prepare-ci-linux-sandbox.sh
      - name: Install backend for the real FastAPI and native ownership test
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e ".[dev]"
      - name: Install bundled editor language services
        run: npm ci --prefix language-services --omit=dev --no-audit --no-fund
      - name: Install desktop
        run: npm ci
      - name: Configure the Electron sandbox helper
        run: |
          node -e 'require("electron")'
          electron_binary="$(node -p 'require("electron")')"
          electron_sandbox="$(dirname "$electron_binary")/chrome-sandbox"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
      - name: Unit tests
        run: npm run test:unit
      - name: Electron smoke test
        run: xvfb-run -a npm run test:e2e

  electron-frontend:
    name: Electron Playwright integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run Electron-facing frontend tests
        working-directory: frontend
        run: xvfb-run -a npm run test:e2e:electron
