name: MiniCode CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend protocol and tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            test_path: backend/tests
          - suite: root
            test_path: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Collect backend and root tests
        run: python -m pytest "${{ matrix.test_path }}" --collect-only -q
      - name: Check agent kernel boundaries
        run: python scripts/check-agent-kernel-boundaries.py
      - name: Check protocol sync
        run: python scripts/check-protocol-sync.py
      - name: Run backend and root tests
        run: |
          set -o pipefail
          python -m pytest "${{ matrix.test_path }}" --maxfail=1 --tb=short 2>&1 | tee "pytest-${{ matrix.suite }}.log"
      - name: Surface backend test failure
        if: failure()
        run: |
          if grep -q '^=\+ FAILURES =\+' "pytest-${{ matrix.suite }}.log"; then
            failure_lines=$(sed -n '/^=\+ FAILURES =\+/,/^=\+ short test summary info =\+/p' "pytest-${{ matrix.suite }}.log" | head -160)
          else
            failure_lines=$(tail -120 "pytest-${{ matrix.suite }}.log")
          fi
          while IFS= read -r line; do
            echo "::error file=pytest-${{ matrix.suite }}.log::${line}"
          done <<< "$failure_lines"

  frontend:
    name: Frontend tests and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle-budget
      - name: UI debt budget
        run: npm run check:ui-debt

  desktop:
    name: Desktop unit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Electron smoke test
        run: xvfb-run -a npm run test:e2e

  electron-frontend:
    name: Electron Playwright integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run Electron-facing frontend tests
        working-directory: frontend
        run: xvfb-run -a npm run test:e2e:electron
