<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动效对照 — MiniCode UI 改造</title>
    <link rel="stylesheet" href="_tokens.css" />
    <link rel="stylesheet" href="_chrome.css" />
    <link rel="stylesheet" href="style-b-hybrid.css" />
    <style>
      .m-grid { display: grid; gap: 14px; }
      .m-case {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--surface-base);
      }
      .m-label { display: grid; gap: 3px; }
      .m-label b { font-size: var(--text-xs); font-weight: 600; color: var(--text-primary); }
      .m-label span { font-size: var(--text-2xs); color: var(--text-muted); line-height: 1.45; }
      .m-demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 40px; }
      .m-note { font-size: var(--text-2xs); color: var(--text-muted); }
      .m-bad { color: var(--state-danger); }
      .m-good { color: var(--state-success); }

      /* ── 1. overlay 关闭动画（reset.css:143 的真 bug） ───────────── */
      .m-overlay-host {
        position: relative;
        width: 220px; height: 78px;
        border: 1px dashed var(--border-soft);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .m-overlay {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        background: var(--surface-raised);
        border: 1px solid var(--border-soft);
        font-size: var(--text-2xs); color: var(--text-secondary);
      }
      .m-overlay[hidden] { display: none; }
      .m-overlay.opening { animation: m-fade-in var(--transition-normal) both; }
      /* 修复后：不再拼 -out 后缀，声明有效，关闭真的会淡出 */
      .m-overlay.closing-fixed { animation: m-fade-out var(--transition-fast) both; }
      /* 现状：等价于 reset.css:144，整条声明无效 → 硬切 */
      .m-overlay.closing-broken { animation: m-fade-out var(--transition-fast)-in both; }
      @keyframes m-fade-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
      @keyframes m-fade-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.97); } }

      /* ── 2. spinner 收敛：现状 8 种 → 1 种 ─────────────────────── */
      .m-spin-row { display: flex; align-items: center; gap: 18px; }
      .m-spin-item { display: grid; justify-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); }
      .m-ring {
        width: 15px; height: 15px; border-radius: 50%;
        border: 1.5px solid var(--border-strong);
        border-top-color: var(--accent-primary);
        animation: m-spin 800ms linear infinite;
      }
      .m-dots { display: inline-flex; gap: 3px; }
      .m-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-primary); animation: m-bounce 1.1s ease-in-out infinite; }
      .m-dots i:nth-child(2) { animation-delay: 220ms; }
      .m-dots i:nth-child(3) { animation-delay: 440ms; }
      .m-pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-primary); animation: m-pulse 1.4s var(--easing-pulse) infinite; }
      .m-bar { position: relative; width: 90px; height: 3px; border-radius: 999px; background: var(--surface-active); overflow: hidden; }
      .m-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 999px; background: var(--accent-primary); animation: m-indeterminate 1.2s var(--easing-standard) infinite; }
      .m-sheen {
        font-size: var(--text-xs);
        background: linear-gradient(90deg, var(--text-muted) 30%, var(--text-primary) 50%, var(--text-muted) 70%) 0 0 / 200% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: m-sheen 1.8s linear infinite;
      }
      @keyframes m-spin { to { transform: rotate(360deg); } }
      @keyframes m-bounce { 0%, 100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-4px); opacity: 1; } }
      @keyframes m-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
      @keyframes m-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes m-sheen { to { background-position: -200% 0; } }

      /* ── 3. 展开/收起：display:none 不可过渡 vs grid-rows 可过渡 ── */
      .m-disc { border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; width: 100%; }
      .m-disc-head {
        width: 100%; display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border: 0; cursor: pointer;
        background: var(--surface-soft); color: var(--text-primary);
        font: inherit; font-size: var(--text-2xs); text-align: left;
      }
      .m-disc-body-broken { display: none; }
      .m-disc.is-open .m-disc-body-broken { display: block; }
      .m-disc-body-fixed {
        display: grid; grid-template-rows: 0fr;
        transition: grid-template-rows var(--transition-normal);
      }
      .m-disc.is-open .m-disc-body-fixed { grid-template-rows: 1fr; }
      .m-disc-body-fixed > div { overflow: hidden; }
      .m-disc-inner { padding: 9px 10px; font-size: var(--text-2xs); color: var(--text-secondary); font-family: var(--font-mono); }

      /* ── 4. 消息入场 ─────────────────────────────────────────── */
      .m-msg {
        padding: 9px 12px; border-radius: var(--radius-md);
        background: var(--surface-soft); border: 1px solid var(--border-subtle);
        font-size: var(--text-2xs); color: var(--text-secondary);
      }
      .m-msg.replay { animation: m-msg-in var(--duration-base) var(--easing-enter) both; }
      @keyframes m-msg-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

      /* ── 5. 按钮 hover/press ─────────────────────────────────── */
      .m-btn {
        height: 30px; padding: 0 13px;
        border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
        background: var(--surface-raised); color: var(--text-primary);
        font: inherit; font-size: var(--text-2xs); cursor: pointer;
        transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-micro);
      }
      .m-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
      .m-btn:active { transform: scale(0.97); }
      .m-btn-shadowed:hover { box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }

      @media (prefers-reduced-motion: reduce) {
        .m-ring, .m-dots i, .m-pulse, .m-bar::after, .m-sheen { animation: none; }
        .m-sheen { color: var(--text-muted); -webkit-text-fill-color: currentColor; }
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { ICONS } from "./_shell.js";

      const DEMOS = [
        ["demo-a-terminal.html", "A 终端派"],
        ["demo-b-hybrid.html", "B 混排派"],
        ["demo-c-refined.html", "C 精致派"],
        ["demo-motion.html", "动效对照"],
      ];

      const links = DEMOS.map(
        ([f, l]) => `<a href="${f}"${f === "demo-motion.html" ? ' aria-current="page"' : ""}>${l}</a>`,
      ).join("");

      document.body.innerHTML = `
        <div class="demo-bar">
          <strong>动效对照</strong>
          <span>左列是现状，右列是修复/收敛后。点按钮触发。</span>
          <nav>${links}<button id="demo-theme" type="button">明/暗</button></nav>
        </div>
        <div class="demo-stage">
          <p class="demo-section-label">1 · 浮层关闭动画（reset.css:143 的真 bug，影响全部 10 个浮层）</p>
          <div class="m-grid">
            <div class="m-case">
              <div class="m-label">
                <b class="m-bad">现状：硬切</b>
                <span><code>var(--transition-fast)-in</code> 是无效 CSS，整条 animation 声明被浏览器丢弃</span>
              </div>
              <div class="m-demo">
                <div class="m-overlay-host">
                  <div class="m-overlay" id="ov-broken" hidden>浮层内容</div>
                </div>
                <button class="m-btn" id="btn-broken" type="button">打开后关闭</button>
              </div>
            </div>
            <div class="m-case">
              <div class="m-label">
                <b class="m-good">修复后：淡出</b>
                <span>去掉 <code>-in</code> 后缀即可，令牌本身已含缓动函数</span>
              </div>
              <div class="m-demo">
                <div class="m-overlay-host">
                  <div class="m-overlay" id="ov-fixed" hidden>浮层内容</div>
                </div>
                <button class="m-btn" id="btn-fixed" type="button">打开后关闭</button>
              </div>
            </div>
          </div>

          <p class="demo-section-label">2 · Loading 指示器：现状 8 种实现，建议收敛到 1–2 种</p>
          <div class="m-grid">
            <div class="m-case">
              <div class="m-label">
                <b>现状并存</b>
                <span>环形 / 三点 / 脉冲点 / 进度条 / 文字流光，散布在 reset.css、cells.css、agent-loop.css、BrowserPanel.css</span>
              </div>
              <div class="m-demo">
                <div class="m-spin-row">
                  <div class="m-spin-item"><div class="m-ring"></div><span>ring</span></div>
                  <div class="m-spin-item"><div class="m-dots"><i></i><i></i><i></i></div><span>dots</span></div>
                  <div class="m-spin-item"><div class="m-pulse"></div><span>pulse</span></div>
                  <div class="m-spin-item"><div class="m-bar"></div><span>bar</span></div>
                  <div class="m-spin-item"><div class="m-sheen">Thinking…</div><span>sheen</span></div>
                </div>
              </div>
            </div>
            <div class="m-case">
              <div class="m-label">
                <b class="m-good">建议保留</b>
                <span>确定性进度用 bar，不确定用 ring；流光只留给「思考中」文本一处</span>
              </div>
              <div class="m-demo">
                <div class="m-spin-row">
                  <div class="m-spin-item"><div class="m-ring"></div><span>ring</span></div>
                  <div class="m-spin-item"><div class="m-bar"></div><span>bar</span></div>
                </div>
              </div>
            </div>
          </div>

          <p class="demo-section-label">3 · 展开 / 收起（ThinkingCell、ToolCallCard、ActivityCell）</p>
          <div class="m-grid">
            <div class="m-case">
              <div class="m-label">
                <b class="m-bad">现状：无过渡</b>
                <span><code>display: none</code>（cells.css:1576）无法过渡；工具卡则是直接 mount/unmount</span>
              </div>
              <div class="m-demo">
                <div class="m-disc" id="disc-broken">
                  <button class="m-disc-head" type="button">${ICONS.chevron}<span>展开详情</span></button>
                  <div class="m-disc-body-broken"><div class="m-disc-inner">exit 0 · 3 files changed</div></div>
                </div>
              </div>
            </div>
            <div class="m-case">
              <div class="m-label">
                <b class="m-good">修复后：高度过渡</b>
                <span><code>grid-template-rows: 0fr → 1fr</code>，开合都有动效且无需测量高度</span>
              </div>
              <div class="m-demo">
                <div class="m-disc" id="disc-fixed">
                  <button class="m-disc-head" type="button">${ICONS.chevron}<span>展开详情</span></button>
                  <div class="m-disc-body-fixed"><div><div class="m-disc-inner">exit 0 · 3 files changed</div></div></div>
                </div>
              </div>
            </div>
          </div>

          <p class="demo-section-label">4 · 消息入场（现状相邻消息有两种近似入场，建议合一）</p>
          <div class="m-grid">
            <div class="m-case">
              <div class="m-label">
                <b>统一入场</b>
                <span>5px 上浮 + 淡入，<code>--easing-enter</code>，200ms</span>
              </div>
              <div class="m-demo">
                <div class="m-msg" id="msg-replay">这是一条新消息</div>
                <button class="m-btn" id="btn-msg" type="button">重播</button>
              </div>
            </div>
          </div>

          <p class="demo-section-label">5 · 按钮 hover / press</p>
          <div class="m-grid">
            <div class="m-case">
              <div class="m-label">
                <b class="m-bad">现状：全局阴影</b>
                <span>reset.css:348 给<em>所有</em> button 加 hover 阴影，与扁平/ghost 设计冲突</span>
              </div>
              <div class="m-demo">
                <button class="m-btn m-btn-shadowed" type="button">悬停我</button>
              </div>
            </div>
            <div class="m-case">
              <div class="m-label">
                <b class="m-good">建议：仅底色+边框</b>
                <span>hover 变底色与边框，press 缩放 0.97，不加阴影</span>
              </div>
              <div class="m-demo">
                <button class="m-btn" type="button">悬停我</button>
              </div>
            </div>
          </div>

          <p class="m-note" style="margin-top: 18px">
            提示：在系统里开启「减少动态效果」后刷新，本页所有循环动画应当停止。
            现状有一个缺口——<code>SidebarShared.tsx:43</code> 用的是 SVG SMIL <code>&lt;animateTransform&gt;</code>，
            不受 CSS <code>prefers-reduced-motion</code> 约束，开了偏好照转。
          </p>
        </div>`;

      document.getElementById("demo-theme").addEventListener("click", () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
      });

      const cycle = (overlay, closeClass) => {
        overlay.hidden = false;
        overlay.classList.remove("closing-fixed", "closing-broken");
        overlay.classList.add("opening");
        setTimeout(() => {
          overlay.classList.remove("opening");
          overlay.classList.add(closeClass);
          setTimeout(() => {
            overlay.hidden = true;
            overlay.classList.remove(closeClass);
          }, 400);
        }, 900);
      };

      document.getElementById("btn-broken").addEventListener("click", () =>
        cycle(document.getElementById("ov-broken"), "closing-broken"),
      );
      document.getElementById("btn-fixed").addEventListener("click", () =>
        cycle(document.getElementById("ov-fixed"), "closing-fixed"),
      );

      for (const id of ["disc-broken", "disc-fixed"]) {
        const disc = document.getElementById(id);
        disc.querySelector(".m-disc-head").addEventListener("click", () =>
          disc.classList.toggle("is-open"),
        );
      }

      document.getElementById("btn-msg").addEventListener("click", () => {
        const msg = document.getElementById("msg-replay");
        msg.classList.remove("replay");
        void msg.offsetWidth;
        msg.classList.add("replay");
      });
    </script>
  </body>
</html>
