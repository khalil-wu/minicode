[project]
name = "minicode"
version = "0.2.0"
description = "MiniCode Agent — AI 编程助手后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.75,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
  "anthropic>=0.42,<1.0",
  "mcp[cli]>=1.27.1,<2.0",
  "pydantic>=2.0,<3.0",
  "jsonschema>=4.23,<5.0",
  "httpx>=0.28,<1.0",
  "psutil>=6.0,<8.0",
  "pathspec>=0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "tzdata>=2025.2",
  "defusedxml>=0.7,<1.0",
  "keyring>=25,<26",
  "filelock>=3.16,<4.0",
  "regex>=2024.11,<2027",
  "watchdog>=6.0,<7.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "desktop*", "node_modules*", "data*", "skills*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]
docparse = [
  "pymupdf>=1.24,<2.0",
  "pymupdf4llm>=0.0.17,<1.0",
  "python-docx>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
