[project]
name = "minicode"
version = "0.2.0"
description = "MiniCode Agent — AI 编程助手后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.75,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
  "anthropic>=0.42,<1.0",
  "chromadb>=0.5,<1.0",
  "mcp[cli]>=1.0,<2.0",
  "pydantic>=2.0,<3.0",
  "httpx>=0.28,<1.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "desktop*", "node_modules*", "foo*", "data*", "skills*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]
search = [
  "ddgs>=9.0,<10.0",
  "duckduckgo-search>=7.0,<8.0",
]
docparse = [
  "trafilatura>=2.0,<3.0",
  "pymupdf>=1.24,<2.0",
  "pymupdf4llm>=0.0.17,<1.0",
  "python-docx>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
