<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Chat</title>
<style>body{margin:0;background:#101318;color:#f5f7fa;font:16px system-ui}main{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header,footer{padding:14px;border-bottom:1px solid #303640}h1{font-size:20px;margin:0 0 10px}input,textarea,button{font:inherit;color:inherit;background:#1a2029;border:1px solid #3a4552;border-radius:8px;padding:10px}input{width:100%;box-sizing:border-box;margin-bottom:8px}textarea{width:100%;box-sizing:border-box;min-height:90px;resize:vertical;margin:8px 0}button{background:#2563eb;border-color:#2563eb}#log{flex:1;padding:14px;white-space:pre-wrap;overflow:auto;font:13px ui-monospace,monospace}.row{display:flex;gap:8px}.row button{flex:0 0 90px}.hint{color:#94a3b8;font-size:12px}</style>
<main><header><h1>Codex Chat</h1><div class="hint">Provider: AnyRouter · 权限: Full Access</div><input id="token" type="password" placeholder="访问口令"><input id="cwd" value="/root/minicode" placeholder="工作目录"><div class="row"><select id="model"><option value="gpt-6-astra">GPT-6 Astra</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option><option value="gpt-5.5">GPT-5.5</option></select><select id="effort"><option value="minimal">思考：快速</option><option value="low">思考：较低</option><option value="medium" selected>思考：标准</option><option value="high">思考：深入</option><option value="xhigh">思考：极深</option><option value="max">思考：最大</option></select></div><div class="hint">输入自然语言或 Codex 命令，服务器会在该目录执行。</div></header><div id="log">等待消息...</div><footer><textarea id="prompt" placeholder="例如：开发 /root/minicode，检查测试并修复失败项"></textarea><div class="row"><span id="status" class="hint">就绪</span><button id="send">发送</button></div></footer></main>
<script>const $=x=>document.getElementById(x);$('send').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt)return;$('prompt').value='';$('log').textContent+='\n\n你： '+prompt+'\nCodex： ';$('status').textContent='执行中';$('send').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{Authorization:'Bearer '+$('token').value,'content-type':'application/json'},body:JSON.stringify({prompt,cwd:$('cwd').value,model:$('model').value,effort:$('effort').value})});if(!r.ok)throw Error(await r.text());const reader=r.body.getReader(),d=new TextDecoder();let b='';while(1){const x=await reader.read();if(x.done)break;b+=d.decode(x.value);for(const part of b.split('\n\n').slice(0,-1)){if(part.startsWith('data: ')){const e=JSON.parse(part.slice(6));if(e.stream){$('log').textContent+=e.stream;$('log').scrollTop=$('log').scrollHeight}if(e.done)$('status').textContent=e.code?'失败':'完成'}}b=b.split('\n\n').slice(-1)[0]}}catch(e){$('log').textContent+='\n错误：'+e.message;$('status').textContent='失败'}finally{$('send').disabled=false}};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('send').click()}</script>
